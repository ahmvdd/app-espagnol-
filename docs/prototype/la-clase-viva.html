<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Clase Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5FB;--surface:#FFFFFF;--ink:#16203B;--muted:#56607A;
  --cobalt:#2340B8;--on-cobalt:#FFFFFF;--tile:#DCE3FA;--ochre:#E3A21A;
  --pink:#C8326B;--olive:#3F7A26;--line:#D3D9EA;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1325;--surface:#171F3D;--ink:#EDF0FA;--muted:#A6AFC8;
    --cobalt:#7C93FF;--on-cobalt:#0E1325;--tile:#26315F;--ochre:#F2BA45;
    --pink:#F0709D;--olive:#8BC462;--line:#2B3660;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1325;--surface:#171F3D;--ink:#EDF0FA;--muted:#A6AFC8;
  --cobalt:#7C93FF;--on-cobalt:#0E1325;--tile:#26315F;--ochre:#F2BA45;
  --pink:#F0709D;--olive:#8BC462;--line:#2B3660;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem 1rem;flex-wrap:wrap}
.brand{font:800 1.3rem/1 var(--display);display:flex;align-items:center;gap:.55rem;background:none;border:0;cursor:pointer;padding:.2rem 0}
.brand i{width:30px;height:30px;border-radius:7px;--t:30px}
nav{display:flex;gap:.3rem;margin-left:auto;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:.5rem .85rem;border-radius:999px;font-weight:700;cursor:pointer}
nav button:hover{background:var(--tile)}
nav button[aria-current="page"]{background:var(--cobalt);color:var(--on-cobalt)}
main{max-width:1120px;margin:0 auto;padding:1.25rem 1rem 5rem}
footer{max-width:1120px;margin:0 auto;padding:0 1rem 2rem;color:var(--muted);font-size:.9rem}

.azulejo{background-color:var(--cobalt);background-image:
  radial-gradient(circle at 50% 50%,var(--ochre) 0 9%,transparent 10%),
  radial-gradient(circle at 50% 50%,transparent 0 22%,var(--paper) 23% 27%,transparent 28%),
  radial-gradient(circle at 0 0,var(--paper) 0 21%,transparent 22%),
  radial-gradient(circle at 100% 0,var(--paper) 0 21%,transparent 22%),
  radial-gradient(circle at 0 100%,var(--paper) 0 21%,transparent 22%),
  radial-gradient(circle at 100% 100%,var(--paper) 0 21%,transparent 22%);
  background-size:var(--t,64px) var(--t,64px)}

h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
.display{font-weight:800;font-size:clamp(2.8rem,8vw,5.6rem);letter-spacing:-.02em}
.h2{font-weight:800;font-size:clamp(1.7rem,4vw,2.4rem)}
h3{font-weight:600;font-size:1.3rem}
.lede{font-size:1.2rem;max-width:60ch;color:var(--muted);margin:.75rem 0 0}
.muted{color:var(--muted)}.small{font-size:.9rem}
p{margin:.4rem 0}

.hero{margin:-1.25rem -1rem 2rem}
.hero-band{height:150px}
.hero-card{background:var(--surface);margin:-70px 1rem 0;padding:1.75rem 1.5rem 1.5rem;border-radius:18px;border:1px solid var(--line);max-width:820px;position:relative}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-bottom:2rem}
.door{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:1.25rem;cursor:pointer;display:flex;flex-direction:column;gap:.35rem}
.door b{font:800 1.6rem/1 var(--display);color:var(--cobalt)}
.door:hover{border-color:var(--cobalt)}

.row{display:flex;gap:.75rem;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.head{justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.narrow{max-width:640px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.25rem}
.stage{min-height:340px;padding:1.5rem}
.stack>*+*{margin-top:1rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--cobalt);color:var(--on-cobalt);border:2px solid var(--cobalt);border-radius:10px;padding:.65rem 1.1rem;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--cobalt)}
.btn.warn{background:transparent;color:var(--pink);border-color:var(--pink)}
.btn.ok{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.bigbtn{font-size:1.4rem;padding:.9rem 2rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{min-height:36px;padding:.35rem .7rem;font-size:.95rem}

.seg{display:inline-flex;border:2px solid var(--cobalt);border-radius:999px;overflow:hidden}
.seg button,.seg label span{display:block;border:0;background:transparent;padding:.4rem 1rem;font-weight:700;cursor:pointer;color:var(--cobalt)}
.seg button[aria-pressed="true"],.seg input:checked+span{background:var(--cobalt);color:var(--on-cobalt)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{position:relative}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin-bottom:1rem}
.tool{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.7rem .8rem;cursor:pointer;display:flex;flex-direction:column;gap:.15rem}
.tool b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.tool span{font-size:.85rem;color:var(--muted);line-height:1.3}
.tool[aria-pressed="true"]{border-color:var(--cobalt);background:var(--tile)}

.huge{font:800 clamp(2.6rem,9vw,6.5rem)/1.05 var(--display);letter-spacing:-.02em;word-break:break-word}
.big{font:600 clamp(1.5rem,4vw,2.4rem)/1.2 var(--display)}
.win{color:var(--cobalt)}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .5s ease}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.pill{display:inline-block;background:var(--tile);border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.95rem}

label{display:block;font-weight:700;margin:.75rem 0 .3rem}
label small{display:block;font-weight:400;color:var(--muted);margin-top:.25rem}
label.inline{display:flex;gap:.5rem;align-items:center;font-weight:400}
input[type=text],input[type=number],input[type=password],input:not([type]),select,textarea{width:100%;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:.6rem .75rem;margin-top:.3rem}
label.inline input{width:auto;margin:0}
textarea{resize:vertical}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:700;margin-bottom:.4rem}
.answer{font-size:1.5rem;text-align:center;max-width:420px}
.acc{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.key{min-width:40px;min-height:40px;border:2px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;cursor:pointer}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;width:100%;max-width:820px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:.75rem;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.85rem 1rem;font-size:1.2rem;cursor:pointer;min-height:56px}
.opt i{font-style:normal;font:800 1.1rem/1 var(--display);width:2rem;height:2rem;border-radius:8px;background:var(--tile);display:grid;place-items:center;flex:none}
.opt.correct{background:var(--olive);border-color:var(--olive);color:#fff}
.opt.wrong{background:var(--pink);border-color:var(--pink);color:#fff}
.opt:disabled{cursor:default}

.scores{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.score{border:2px solid var(--line);border-radius:12px;padding:.5rem 1rem;text-align:center;min-width:120px}
.score b{display:block;font:800 2rem/1 var(--display)}

.sem{display:flex;flex-direction:column;gap:1rem;align-items:center;background:var(--ink);padding:1.25rem;border-radius:999px;width:max-content;margin:0 auto}
.luz{width:110px;height:110px;border-radius:50%;border:0;cursor:pointer;opacity:.25}
.luz.verde{background:#3BB54A}.luz.naranja{background:#F39C12}.luz.rojo{background:#E2382F}
.luz[aria-pressed="true"]{opacity:1;box-shadow:0 0 40px currentColor}
.luz.verde{color:#3BB54A}.luz.naranja{color:#F39C12}.luz.rojo{color:#E2382F}
.clock{font:800 clamp(3.5rem,12vw,7rem)/1 var(--display);font-variant-numeric:tabular-nums}
.clock.done{color:var(--pink)}

.mosaic{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:520px;width:100%}
.mosaic.mini{max-width:260px;gap:2px}
.tilecell{aspect-ratio:1;border-radius:3px;border:1.5px dashed var(--line)}
.tilecell.on{border:0;background:radial-gradient(circle,var(--ochre) 0 20%,transparent 23%),radial-gradient(circle,transparent 0 40%,var(--paper) 42% 50%,transparent 52%),var(--cobalt)}

.doorsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;width:100%;max-width:820px}
@media (max-width:640px){.doorsgrid{grid-template-columns:repeat(2,1fr)}}
.room{border:2px solid var(--line);border-radius:12px;padding:1rem .5rem;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.room b{font:800 2.4rem/1 var(--display);color:var(--muted)}
.room.solved{border-color:var(--olive)}.room.solved b{color:var(--olive)}
.room[aria-pressed="true"]{border-color:var(--cobalt);background:var(--tile)}
.lock{display:flex;gap:.5rem}
.lock input{width:3.2rem;height:4rem;text-align:center;font:800 2rem var(--display);padding:0}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .35s}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.card3d{width:100%;max-width:520px;min-height:220px;border:2px solid var(--cobalt);border-radius:18px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:1.5rem}
.card3d.back{background:var(--tile)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin:1rem 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem;text-align:center}
.stat b{display:block;font:800 1.9rem/1 var(--display);color:var(--cobalt)}
.stat span{font-size:.9rem;color:var(--muted)}
.codecard{border:2px solid var(--ochre)}
code.code{font:700 1.15rem/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--tile);padding:.2rem .5rem;border-radius:6px;word-break:break-all}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin:1rem 0}

.passport{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem}
.country{border:2px solid var(--line);border-radius:12px;padding:.7rem;background:var(--surface);cursor:pointer;text-align:left;font-weight:700;min-height:64px;position:relative}
.country.stamped{border-color:var(--ochre)}
.country.stamped::after{content:"Visitado";position:absolute;right:.4rem;bottom:.35rem;font:800 .7rem/1 var(--display);color:var(--ochre);border:2px solid var(--ochre);border-radius:6px;padding:.15rem .3rem;transform:rotate(-8deg)}

.ev{display:flex;gap:.75rem;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.75rem 1rem;cursor:pointer;width:100%;max-width:640px;font-size:1.05rem}
.ev i{font-style:normal;font:800 1.1rem/1 var(--display);width:2rem;height:2rem;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;flex:none}
.ev.picked i{background:var(--cobalt);color:var(--on-cobalt);border:0}
.ev.good{border-color:var(--olive)}.ev.bad{border-color:var(--pink)}

.w-ok{color:var(--olive);font-weight:700}.w-acc{color:var(--ochre);font-weight:700;text-decoration:underline wavy}.w-bad{color:var(--pink);font-weight:700;text-decoration:line-through}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
.badge{border:2px dashed var(--line);border-radius:12px;padding:.75rem;opacity:.6}
.badge.on{border:2px solid var(--ochre);opacity:1}
.badge b{font-family:var(--display);display:block}

.tabs{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:1rem}
.tabs button{border:0;background:transparent;padding:.6rem 1rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{border-color:var(--cobalt);color:var(--cobalt)}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.classcard{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.classcard{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.err{color:var(--pink);font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--paper);padding:.7rem 1.2rem;border-radius:999px;font-weight:700;z-index:20;transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="brand" data-go="inicio"><i class="azulejo" aria-hidden="true"></i>La Clase Viva</button>
    <nav aria-label="Navigation principale">
      <button data-go="inicio">Inicio</button>
      <button data-go="clase">En clase</button>
      <button data-go="casa">En casa</button>
      <button data-go="profe">Profe</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer>Les données restent sur l’appareil utilisé : rien n’est envoyé sur Internet.</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const norm=s=>String(s).toLowerCase().replace(/[¿?¡!.,;:«»"“”]/g,'').replace(/\s+/g,' ').trim();
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayIdx=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LETTERS='ABCD';
function chk(s){let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return (h%1679616).toString(36).toUpperCase().padStart(4,'0')}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
let actx;function beep(f=660,d=.2){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
let esVoice=null;
function loadVoices(){const v=speechSynthesis.getVoices();esVoice=v.find(x=>/^es[-_]ES/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(t,rate=.9){if(!('speechSynthesis' in window)){toast('L’audio n’est pas disponible sur ce navigateur');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';if(esVoice)u.voice=esVoice;u.rate=rate;speechSynthesis.speak(u)}
let timers=[];const every=(fn,ms)=>{const id=setInterval(fn,ms);timers.push(id);return id};const later=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id};
function stopTimers(){timers.forEach(id=>{clearInterval(id);clearTimeout(id)});timers=[]}
const ACC=['á','é','í','ó','ú','ñ','ü','¿','¡'];
const accentBar=sel=>`<div class="acc" data-for="${sel}">${ACC.map(c=>`<button type="button" class="key" data-c="${c}" aria-label="Insérer ${c}">${c}</button>`).join('')}</div>`;
function bindAcc(el){$$('.acc',el).forEach(bar=>{const inp=$(bar.dataset.for,el);bar.onmousedown=e=>e.preventDefault();bar.onclick=e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c||!inp)return;const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+c+inp.value.slice(en);inp.focus();inp.setSelectionRange(s+1,s+1)}})}
async function copy(text,ta){try{await navigator.clipboard.writeText(text);toast('Copié')}catch(e){if(ta){ta.select();try{document.execCommand('copy');toast('Copié')}catch(_){toast('Sélectionne le texte et copie-le')}}}}

/* ---------- contenus ---------- */
const NIVELES=['5e','4e','3e'];
const VOCAB={
'5e':{
 'Me presento':[['hola','bonjour'],['me llamo','je m’appelle'],['tengo doce años','j’ai douze ans'],['vivo en','j’habite à'],['el cumpleaños','l’anniversaire'],['simpático','sympathique'],['alto','grand'],['divertido','drôle']],
 'La familia':[['el padre','le père'],['la madre','la mère'],['el hermano','le frère'],['la hermana','la sœur'],['los abuelos','les grands-parents'],['el primo','le cousin'],['el tío','l’oncle'],['el perro','le chien']],
 'El colegio':[['la mochila','le cartable'],['el cuaderno','le cahier'],['la profesora','la professeure'],['el recreo','la récréation'],['la asignatura','la matière'],['los deberes','les devoirs'],['el lápiz','le crayon'],['la pizarra','le tableau']],
 'La comida':[['el desayuno','le petit-déjeuner'],['la comida','le déjeuner'],['la cena','le dîner'],['el pan','le pain'],['la manzana','la pomme'],['el agua','l’eau'],['me gusta','j’aime'],['tengo hambre','j’ai faim']]
},
'4e':{
 'La ciudad':[['la calle','la rue'],['el ayuntamiento','la mairie'],['la plaza','la place'],['a la derecha','à droite'],['a la izquierda','à gauche'],['todo recto','tout droit'],['el barrio','le quartier'],['el museo','le musée']],
 'La rutina':[['despertarse','se réveiller'],['levantarse','se lever'],['ducharse','se doucher'],['desayunar','prendre le petit-déjeuner'],['volver a casa','rentrer à la maison'],['acostarse','se coucher'],['a menudo','souvent'],['nunca','jamais']],
 'Los viajes':[['el billete','le billet'],['la maleta','la valise'],['el avión','l’avion'],['la estación','la gare'],['el alojamiento','le logement'],['la playa','la plage'],['el extranjero','l’étranger'],['viajar','voyager']],
 'El tiempo libre':[['el ocio','les loisirs'],['quedar con amigos','retrouver des amis'],['el partido','le match'],['ir de compras','faire les magasins'],['tocar la guitarra','jouer de la guitare'],['el fin de semana','le week-end'],['aburrido','ennuyeux'],['divertido','amusant']]
},

function vocabOf(niv){const v={};for(const [k,a] of Object.entries(VOCAB[niv]))v[k]=[...a];for(const c of S.prof.vocab)if(c.niv===niv)(v[c.theme]=v[c.theme]||[]).push([c.es,c.fr]);return v}
function pairsOf(niv,theme){const v=vocabOf(niv);return theme==='all'||!v[theme]?Object.values(v).flat():v[theme]}
function qVocab(pairs,all){const p=pick(pairs),fr=Math.random()<.5,k=fr?1:0;const others=shuffle([...new Set(all.map(x=>x[k]).filter(x=>x!==p[k]))]).slice(0,3);const o=shuffle([p[k],...others]);return {q:fr?`¿Qué significa « ${p[0]} » ?`:`Comment dit-on « ${p[1]} » en espagnol ?`,o,a:o.indexOf(p[k])}}
function qConj(niv){const t=pick(TIEMPOS_NIVEL[niv]),v=pick(VERBS),p=Math.random()*6|0,c=conj(v,t,p);const others=shuffle([...new Set([0,1,2,3,4,5].map(x=>conj(v,t,x)).filter(x=>x!==c))]).slice(0,3);const o=shuffle([c,...others]);return {q:`« ${v} » au ${TIEMPOS[t]} : ${PERS[p]} …`,o,a:o.indexOf(c)}}
function genQuestions(niv,n,theme='all'){const pairs=pairsOf(niv,theme),all=pairsOf(niv,'all');const cq=shuffle(S.prof.questions.filter(q=>q.niv===niv));const out=[];for(let i=0;i<n;i++){const r=Math.random();if(cq.length&&r<.25){const q=cq.pop(),ord=shuffle([0,1,2,3]);out.push({q:q.q,o:ord.map(k=>q.o[k]),a:ord.indexOf(q.a)})}else if(r<.65)out.push(qVocab(pairs,all));else out.push(qConj(niv))}return out}

const grid=()=>{el.innerHTML=`<p class="muted" style="margin-bottom:1rem">Deux questions par pays. Deux bonnes réponses : tampon dans ton passeport et +10 pts.</p><div class="passport">${PAISES.map((p,i)=>`<button class="country ${st.stamps.includes(p[0])?'stamped':''}" data-p="${i}">${esc(p[0])}</button>`).join('')}</div>`;$$('[data-p]',el).forEach(b=>b.onclick=()=>visit(+b.dataset.p))};
const visit=n=>{const P=PAISES[n],caps=shuffle([P[1],...shuffle(PAISES.filter(x=>x!==P).map(x=>x[1])).slice(0,3)]);const qs=[{q:P[0]==='Bolivia'?'¿Cuál es la capital constitucional de Bolivia?':`¿Cuál es la capital de ${P[0]}?`,o:caps,a:caps.indexOf(P[1])},{q:`¿Verdadero o falso? ${P[2]}`,o:['Verdadero','Falso'],a:P[3]?0:1}];let i=0,ok=0;
const draw=()=>{if(i>=2){let msg;if(ok===2&&!st.stamps.includes(P[0])){st.stamps.push(P[0]);const g=addPts(10);msg=`¡Sello conseguido!${g?' +'+g+' pts':''}`}else msg=ok===2?'Déjà visité, mais bravo !':'Pas de tampon cette fois. Retente plus tard.';save();el.innerHTML=`<div class="center"><div class="huge ${ok===2?'win':''}">${esc(P[0])}</div><p class="big">${msg}</p>${P[4]?`<p>${esc(P[4])}</p>`:''}<button class="btn" id="bk">Retour au passeport</button></div>`;$('#bk',el).onclick=grid;return}
const q=qs[i];el.innerHTML=`<div class="center"><span class="pill">${esc(P[0])}, ${i+1} / 2</span><div class="big">${esc(q.q)}</div><button class="btn ghost sm" id="say">Écouter</button>${optsHTML(q)}<div id="nx"></div></div>`;$('#say',el).onclick=()=>speak(q.q);
$$('.opt',el).forEach(b=>b.onclick=()=>{$$('.opt',el).forEach(x=>x.disabled=true);$$('.opt',el)[q.a].classList.add('correct');if(+b.dataset.i===q.a)ok++;else b.classList.add('wrong');$('#nx',el).innerHTML='<button class="btn">Suivante</button>';$('#nx button',el).onclick=()=>{i++;draw()}})};draw()};grid()}

function hLinea(el){const evs=shuffle(EVENTOS).slice(0,5),shown=shuffle(evs);let order=[];
const draw=(checked)=>{const sorted=[...evs].sort((a,b)=>a[0]-b[0]);el.innerHTML=`<div class="center"><p class="big">Touche les événements du plus ancien au plus récent.</p>${shown.map((e,k)=>{const pos=order.indexOf(k);let cls=pos>=0?'picked':'';if(checked)cls+=sorted[pos]===e?' good':' bad';return `<button class="ev ${cls}" data-k="${k}" ${checked?'disabled':''}><i>${pos>=0?pos+1:''}</i><span>${esc(e[1])}${checked?` <b>(${e[0]})</b>`:''}</span></button>`}).join('')}<div class="row wrap" style="justify-content:center">${checked?'<button class="btn" id="re">Nouvelle frise</button>':'<button class="btn ghost" id="cl">Effacer</button>'}</div><div id="msg" aria-live="polite"></div></div>`;
if(checked){const good=shown.every((e,k)=>sorted[order.indexOf(k)]===e);let g=0;if(good)g=addPts(10);$('#msg',el).innerHTML=`<p class="big ${good?'win':''}">${good?'¡Perfecto!'+(g?' +'+g+' pts':''):'Pas tout à fait : regarde les dates.'}</p>`;$('#re',el).onclick=()=>hLinea(el);return}
$('#cl',el).onclick=()=>{order=[];draw()};
$$('.ev',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(order.includes(k))order=order.filter(x=>x!==k);else order.push(k);draw(order.length===5)})};draw(false)}

/* ---------- profe ---------- */
function vProfe(){const P=S.prof;
if(!P.pin){app.innerHTML=`<div class="narrow"><h2 class="h2">Espace Profe</h2><p class="lede">Choisis un code secret pour éviter que les élèves entrent ici.</p><form id="pf" class="panel" style="margin-top:1rem"><label>Code secret (4 à 8 chiffres)<input type="password" inputmode="numeric" name="a" required minlength="4" maxlength="8" pattern="[0-9]{4,8}"></label><label>Confirme le code<input type="password" inputmode="numeric" name="b" required></label><button class="btn" style="margin-top:1rem">Créer mon espace</button></form></div>`;
$('#pf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('a')!==f.get('b')){toast('Les deux codes sont différents');return}P.pin=chk('cv:'+f.get('a'));save();profUnlocked=true;render()};return}
if(!profUnlocked){app.innerHTML=`<div class="narrow"><h2 class="h2">Espace Profe</h2><form id="pu" class="panel" style="margin-top:1rem"><label>Code secret<input type="password" inputmode="numeric" name="a" required autofocus></label><button class="btn" style="margin-top:1rem">Entrer</button><p id="pe" class="err" aria-live="polite"></p></form></div>`;
$('#pu').onsubmit=e=>{e.preventDefault();if(chk('cv:'+new FormData(e.target).get('a'))===P.pin){profUnlocked=true;render()}else $('#pe').textContent='Code incorrect.'};return}
const T=[['classes','Classes'],['codes',`Codes élèves${P.pending.length?' ('+P.pending.length+')':''}`],['contenu','Contenu'],['save','Sauvegarde']];
app.innerHTML=`<div class="row head"><h2 class="h2">Espace Profe</h2><button class="btn ghost sm" id="lock">Verrouiller</button></div><div class="tabs" role="tablist">${T.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${k===profTab}">${n}</button>`).join('')}</div><section id="pt"></section>`;
$('#lock').onclick=()=>{profUnlocked=false;render()};$$('[data-tab]').forEach(b=>b.onclick=()=>{profTab=b.dataset.tab;render()});
({classes:pClasses,codes:pCodes,contenu:pContenu,save:pSave})[profTab]($('#pt'))}

function pClasses(el){const P=S.prof;
el.innerHTML=`<div class="split"><form id="nc" class="panel"><h3>Nouvelle classe</h3><label>Nom<input name="nom" required maxlength="4" placeholder="ex : 4B"><small>Les élèves taperont exactement ce nom.</small></label><label>Niveau<select name="niv">${NIVELES.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Objectif (points)<input type="number" name="obj" value="500" min="50" step="50"></label><label>Récompense<input name="rec" value="Séance escape game"></label><button class="btn" style="margin-top:1rem">Créer la classe</button></form><div>${P.classes.length?P.classes.map((c,i)=>`<div class="classcard"><div><div class="row between"><h3>${esc(c.nom)} <span class="muted small">${c.niv}</span></h3><span class="pill">${c.pts} / ${c.obj}</span></div><p class="small muted">${esc(c.rec)}</p>${mosaic(c.pts,c.obj,true)}</div><div class="row wrap"><button class="btn sm" data-a="plus" data-i="${i}">+10</button><button class="btn ghost sm" data-a="moins" data-i="${i}">−10</button><button class="btn ghost sm" data-a="zero" data-i="${i}">Remettre à zéro</button><button class="btn warn sm" data-a="del" data-i="${i}">Supprimer</button></div></div>`).join(''):'<p class="muted">Aucune classe. Crée la première avec le formulaire.</p>'}<p class="muted small" style="margin-top:1rem">+10 et −10 servent aussi à récompenser la participation en classe.</p></div></div>`;
$('#nc',el).onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),nom=String(f.get('nom')).toUpperCase().replace(/[^A-Z0-9]/g,'');if(!nom)return toast('Nom : lettres et chiffres uniquement');if(P.classes.some(c=>c.nom===nom))return toast('Cette classe existe déjà');P.classes.push({nom,niv:f.get('niv'),obj:Math.max(50,+f.get('obj')||500),rec:String(f.get('rec')||'Séance escape game'),pts:0});save();pClasses(el);toast('Classe '+nom+' créée')};
$$('[data-a]',el).forEach(b=>b.onclick=()=>{const c=P.classes[+b.dataset.i],a=b.dataset.a;if(a==='plus')c.pts+=10;if(a==='moins')c.pts=Math.max(0,c.pts-10);if(a==='zero'&&confirm('Remettre '+c.nom+' à zéro ?'))c.pts=0;if(a==='del'&&confirm('Supprimer la classe '+c.nom+' ?'))P.classes.splice(+b.dataset.i,1);save();pClasses(el)})}

function validatePending(id){const P=S.prof,p=P.pending.find(x=>x.id===id);if(!p)return;const c=P.classes.find(k=>k.nom===p.clase);if(c)c.pts+=p.pts;P.pending=P.pending.filter(x=>x.id!==id);P.history.unshift({...p,ok:true,date:dayKey()});P.history=P.history.slice(0,30);save();toast(`+${p.pts} pts pour la ${p.clase}`)}
function pCodes(el){const P=S.prof;
el.innerHTML=`<div class="split"><form id="cf" class="panel"><h3>Ajouter un code élève</h3><label>Code<input name="c" required autocomplete="off" autocapitalize="characters" placeholder="4B-TIGRE7-40-K2Q-1ABC"></label><button class="btn" style="margin-top:1rem">Ajouter</button><p id="ce" class="err" aria-live="polite"></p><p class="muted small">Le code est vérifié, puis il attend que l’élève réussisse son mini-défi. Un code ne peut servir qu’une fois.</p></form><div><h3>En attente</h3>${P.pending.length?`<ul class="list">${P.pending.map(p=>`<li><span><b>${esc(p.pseudo)}</b> <span class="muted">${esc(p.clase)}</span> ${p.pts} pts</span><span class="row wrap"><button class="btn sm" data-d="${p.id}">Lancer le mini-défi</button><button class="btn ghost sm" data-v="${p.id}">Valider sans défi</button><button class="btn warn sm" data-x="${p.id}">Refuser</button></span></li>`).join('')}</ul>`:'<p class="muted">Aucun code en attente.</p>'}<h3 style="margin-top:1.5rem">Historique</h3>${P.history.length?`<ul class="list">${P.history.slice(0,10).map(h=>`<li><span>${esc(h.pseudo)} <span class="muted">${esc(h.clase)}</span></span><span class="${h.ok?'w-ok':'w-bad'}" style="text-decoration:none">${h.ok?'+'+h.pts+' pts':'refusé'}</span></li>`).join('')}</ul>`:'<p class="muted">Rien pour l’instant.</p>'}</div></div>`;
$('#cf',el).onsubmit=e=>{e.preventDefault();const raw=String(new FormData(e.target).get('c')).toUpperCase().replace(/\s/g,''),parts=raw.split('-'),er=$('#ce',el);er.textContent='';
if(parts.length!==5||chk(parts.slice(0,4).join('-'))!==parts[4]){er.textContent='Code invalide : vérifie la saisie, lettre par lettre.';return}
if(P.used.includes(raw)){er.textContent='Ce code a déjà été utilisé.';return}
const pts=parseInt(parts[2],10);if(!(pts>0)){er.textContent='Ce code ne contient pas de points.';return}
if(!P.classes.some(c=>c.nom===parts[0])){er.textContent=`La classe ${parts[0]} n’existe pas encore : crée-la dans l’onglet Classes.`;return}
P.used.push(raw);P.pending.push({id:raw,clase:parts[0],pseudo:parts[1],pts});save();render()};
$$('[data-d]',el).forEach(b=>b.onclick=()=>{link=b.dataset.d;defi=null;route='clase';claseTool='defi';render()});
$$('[data-v]',el).forEach(b=>b.onclick=()=>{validatePending(b.dataset.v);render()});
$$('[data-x]',el).forEach(b=>b.onclick=()=>{const p=P.pending.find(x=>x.id===b.dataset.x);P.pending=P.pending.filter(x=>x!==p);P.history.unshift({...p,ok:false,date:dayKey()});save();render()})}

function pContenu(el){const P=S.prof,themes=[...new Set(NIVELES.flatMap(n=>Object.keys(vocabOf(n))))];
el.innerHTML=`<p class="muted" style="margin-bottom:1rem">Ce que tu ajoutes ici apparaît dans les activités En clase sur cet ordinateur (palabra del día, quiz, mini-défi).</p><div class="split"><div class="stack"><form id="vf" class="panel"><h3>Ajouter du vocabulaire</h3><label>Niveau<select name="niv">${NIVELES.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Thème<input name="th" list="thl" required placeholder="ex : La ropa"><datalist id="thl">${themes.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></label><label>Espagnol<input name="es" required></label><label>Français<input name="fr" required></label><button class="btn" style="margin-top:1rem">Ajouter le mot</button></form>${P.vocab.length?`<ul class="list">${P.vocab.map((v,i)=>`<li><span><b>${esc(v.es)}</b> ${esc(v.fr)} <span class="muted small">${v.niv}, ${esc(v.theme)}</span></span><button class="btn warn sm" data-dv="${i}">Supprimer</button></li>`).join('')}</ul>`:''}</div>
<div class="stack"><form id="qf" class="panel"><h3>Ajouter une question</h3><label>Niveau<select name="niv">${NIVELES.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Question<input name="q" required></label>${[0,1,2,3].map(i=>`<label class="inline"><input type="radio" name="a" value="${i}" ${i===0?'checked':''} aria-label="Bonne réponse ${LETTERS[i]}"><input name="o${i}" required placeholder="Réponse ${LETTERS[i]}"></label>`).join('')}<p class="muted small">Coche la bonne réponse.</p><button class="btn" style="margin-top:1rem">Ajouter la question</button></form>${P.questions.length?`<ul class="list">${P.questions.map((q,i)=>`<li><span>${esc(q.q)} <span class="muted small">${q.niv}, réponse : ${esc(q.o[q.a])}</span></span><button class="btn warn sm" data-dq="${i}">Supprimer</button></li>`).join('')}</ul>`:''}</div></div>`;
$('#vf',el).onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);P.vocab.push({niv:f.get('niv'),theme:String(f.get('th')).trim(),es:String(f.get('es')).trim(),fr:String(f.get('fr')).trim()});save();pContenu(el);toast('Mot ajouté')};
$('#qf',el).onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);P.questions.push({niv:f.get('niv'),q:String(f.get('q')).trim(),o:[0,1,2,3].map(i=>String(f.get('o'+i)).trim()),a:+f.get('a')});save();pContenu(el);toast('Question ajoutée')};
$$('[data-dv]',el).forEach(b=>b.onclick=()=>{P.vocab.splice(+b.dataset.dv,1);save();pContenu(el)});
$$('[data-dq]',el).forEach(b=>b.onclick=()=>{P.questions.splice(+b.dataset.dq,1);save();pContenu(el)})}

function pSave(el){const P=S.prof,data=JSON.stringify({...P,pin:undefined});
el.innerHTML=`<div class="split"><div class="panel"><h3>Exporter</h3><p class="muted">Copie ce texte et garde-le dans un document : il contient tes classes, points, codes et contenus. Fais-le chaque semaine.</p><textarea id="ex" rows="8" readonly>${esc(data)}</textarea><button class="btn" id="cp" style="margin-top:.75rem">Copier</button></div><div class="panel"><h3>Importer</h3><p class="muted">Colle une sauvegarde pour la restaurer, par exemple sur un autre ordinateur. Les données actuelles seront remplacées.</p><textarea id="im" rows="8"></textarea><button class="btn warn" id="ip" style="margin-top:.75rem">Restaurer</button></div></div>`;
$('#cp',el).onclick=()=>copy(data,$('#ex',el));
$('#ip',el).onclick=()=>{try{const d=JSON.parse($('#im',el).value);if(!Array.isArray(d.classes))throw 0;if(!confirm('Remplacer toutes les données Profe ?'))return;S.prof={...DEF_PROF,...d,pin:P.pin};save();toast('Sauvegarde restaurée');render()}catch(e){toast('Ce texte n’est pas une sauvegarde valide')}}}

render();
})();
</script>
</body>
</html>
